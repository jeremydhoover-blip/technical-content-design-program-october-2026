name: Content check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Check AI tooling and documentation
        run: npm run check:tooling

      - name: Check content files and strings
        run: npm run check

      - name: Run evals
        run: npm run evals

      - name: Build the app
        run: npm run build
